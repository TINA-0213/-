<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <!-- 手机适配核心标签，与首页一致 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>今日碎碎念 - 填写页面</title>
  <!-- 引入Bootstrap CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- 引入统一样式（与首页共用，确保背景/按钮样式一致） -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 填写页面：淡粉色背景，居中布局 -->
  <div class="record-container">
    <!-- 页面标题 -->
    <h2 class="record-title">写下今日感悟</h2>

    <!-- 填写表单（无白色背景，继承淡粉色：仅保留碎碎念内容+照片上传+按钮组） -->
    <div class="record-form">
      <!-- 移除：标题输入框 -->

      <!-- 核心感悟内容（仅保留这部分核心输入） -->
      <div class="mb-3">
        <label class="form-label"></label>
        <textarea id="diaryContent" class="form-control" rows="6" placeholder=""></textarea>
      </div>

      <!-- 照片上传区域 -->
      <div class="mb-3">
        <button id="uploadPhoto" class="btn upload-btn w-100 mb-2">上传照片</button>
        <img id="photoPreview" class="photo-preview" alt="照片预览">
      </div>

      <!-- 淡绿色按钮组：返回首页 + 保存记录 -->
      <div class="btn-group d-flex gap-2">
        <a href="index.html" class="btn green-btn flex-1">返回首页</a>
        <button id="saveDiary" class="btn green-btn flex-1">保存记录</button>
      </div>
    </div>
  </div>

  <!-- 引入Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- 引入功能逻辑JS（与首页共用） -->
  <script src="app.js"></script>
</body>
</html>
