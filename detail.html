<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <!-- 手机适配核心标签，与其他页面一致 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>我的碎碎念 - 所有记录</title>
  <!-- 引入Bootstrap CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- 引入统一样式，确保淡粉色背景+竖线+节点样式 -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 展示页面：淡粉色背景，居中布局 -->
  <div class="detail-container">
    <!-- 页面标题 -->
    <h2 class="detail-title"></h2>

    <!-- 淡绿色返回按钮组 -->
    <div class="btn-group mb-4 d-flex gap-2 justify-content-center" style="max-width: 300px; margin: 0 auto 30px auto;">
      <a href="index.html" class="btn green-btn flex-1">返回首页</a>
      <a href="record.html" class="btn green-btn flex-1">新增记录</a>
    </div>

    <!-- 记录分组容器（按日期分组，承载左侧竖线+日期标题+记录卡片） -->
    <div id="fullDiaryList" class="full-diary-list"></div>
  </div>

  <!-- 引入Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- 引入功能逻辑JS -->
  <script src="app.js"></script>
</body>
</html>
